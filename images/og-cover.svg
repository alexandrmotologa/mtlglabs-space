<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="labsOgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a" />
      <stop offset="60%" stop-color="#0c111d" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="labsTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="labsGlowRight" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.3)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="labsGlowLeft" cx="15%" cy="75%" r="45%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#labsOgBg)" />
  <rect width="1200" height="630" fill="url(#labsGlowRight)" />
  <rect width="1200" height="630" fill="url(#labsGlowLeft)" />

  <!-- Cyber Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Frame -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="rgba(13, 16, 26, 0.75)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2" />

  <!-- Badge -->
  <rect x="130" y="120" width="370" height="42" rx="21" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
  <circle cx="152" cy="141" r="5" fill="#06b6d4" />
  <text x="170" y="147" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#67e8f9" letter-spacing="1">INDEPENDENT PRODUCT &amp; TOOLING STUDIO</text>

  <!-- Title -->
  <text x="130" y="235" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1.5">MTLG LABS</text>

  <!-- Subtitle -->
  <text x="130" y="295" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="700" fill="url(#labsTitleGrad)">Developer Tools &amp; Autonomous Software</text>

  <!-- Description -->
  <text x="130" y="360" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" fill="#94a3b8">
    Ecosystem of 40+ software projects, CLI tooling, AI QA engines &amp; production SaaS.
  </text>
  <text x="130" y="395" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" fill="#94a3b8">
    Founded &amp; Architected by Alexandr Motologa.
  </text>

  <!-- Metrics Chips -->
  <rect x="130" y="455" width="160" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="210" y="482" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">40+ Projects</text>

  <rect x="305" y="455" width="190" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="400" y="482" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#a855f7" text-anchor="middle">108+ Languages</text>

  <rect x="510" y="455" width="160" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
  <text x="590" y="482" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#ec4899" text-anchor="middle">Web3 &amp; AI</text>

  <text x="1060" y="485" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#06b6d4" text-anchor="end">mtlglabs.space ◈</text>
