<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgLabs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="labsCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowLabs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <pattern id="gridLabs" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgLabs)"/>
  <rect width="1200" height="630" fill="url(#gridLabs)"/>

  <circle cx="200" cy="180" r="180" fill="#06b6d4" opacity="0.18" filter="url(#glowLabs)"/>
  <circle cx="1000" cy="450" r="220" fill="#a855f7" opacity="0.15" filter="url(#glowLabs)"/>

  <rect x="70" y="60" width="1060" height="510" rx="24" fill="rgba(10, 15, 30, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Brand Pill Top Left -->
  <rect x="110" y="100" width="330" height="40" rx="20" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
  <circle cx="130" cy="120" r="6" fill="#06b6d4"/>
  <text x="146" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#06b6d4" letter-spacing="1">AUTONOMOUS SOFTWARE LAB</text>

  <!-- Title -->
  <text x="110" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="-1">MTLG Labs</text>
  <text x="110" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="url(#labsCyan)">Developer Tooling • Bubble.io CLI • AI Systems</text>

  <!-- Description -->
  <text x="110" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    High-velocity developer suites, Bubble.io Dev Studio, AI translation engines, AST visualizers,
  </text>
  <text x="110" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    and full-stack SaaS architecture. Built by Alexandr Motologa.
  </text>

  <!-- Feature Badges -->
  <rect x="110" y="390" width="240" height="46" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
  <text x="130" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#06b6d4">⚡ Bubble Dev Studio</text>

  <rect x="365" y="390" width="220" height="46" rx="10" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
  <text x="385" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#c084fc">🤖 AI Automation</text>

  <rect x="600" y="390" width="230" height="46" rx="10" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="620" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">📦 Open Source Tools</text>

  <rect x="845" y="390" width="240" height="46" rx="10" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
  <text x="865" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#4ade80">🚀 40+ Public Products</text>

  <!-- Footer -->
  <line x1="110" y1="475" x2="1080" y2="475" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="110" y="515" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="16" font-weight="600" fill="#64748b">AUTONOMOUS SOFTWARE ECOSYSTEM</text>
  <text x="910" y="515" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="18" font-weight="700" fill="#06b6d4">mtlglabs.space ↗</text>
</svg>