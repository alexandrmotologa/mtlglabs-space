<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgLabsBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanLabsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowLabsBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
    <pattern id="gridLabsBanner" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#bgLabsBanner)"/>
  <rect width="1584" height="396" fill="url(#gridLabsBanner)"/>

  <circle cx="500" cy="120" r="160" fill="#06b6d4" opacity="0.18" filter="url(#glowLabsBanner)"/>
  <circle cx="1400" cy="200" r="180" fill="#a855f7" opacity="0.15" filter="url(#glowLabsBanner)"/>

  <!-- Left Space Reserved for Profile/Company Logo, Text Starts at 380px -->
  <rect x="380" y="45" width="280" height="32" rx="16" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1"/>
  <circle cx="398" cy="61" r="5" fill="#06b6d4"/>
  <text x="412" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#06b6d4" letter-spacing="1">AUTONOMOUS SOFTWARE LAB</text>

  <text x="380" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">MTLG Labs</text>
  <text x="380" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#cyanLabsGrad)">Developer Tooling • Bubble.io Dev Studio • AI Automation</text>

  <text x="380" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
    Engineering local-first developer suites, AST visualizers, AI translation engines &amp; resilient software.
  </text>

  <rect x="380" y="255" width="190" height="38" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
  <text x="396" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#06b6d4">⚡ Bubble Dev Studio</text>

  <rect x="580" y="255" width="180" height="38" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
  <text x="596" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">🤖 AI Tooling</text>

  <rect x="770" y="255" width="180" height="38" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="786" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">📦 Open Source</text>

  <rect x="960" y="255" width="170" height="38" rx="8" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
  <text x="976" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4ade80">🚀 40+ Products</text>

  <!-- Metrics / Right Box -->
  <rect x="1200" y="55" width="330" height="285" rx="16" fill="rgba(10, 16, 32, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="1230" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#06b6d4">40+</text>
  <text x="1230" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Active Public Software Products</text>

  <line x1="1230" y1="155" x2="1500" y2="155" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="1230" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Official Studio Portal:</text>
  <text x="1230" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="18" font-weight="700" fill="#06b6d4">https://mtlglabs.space ↗</text>

  <text x="1230" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Direct Lab Contact:</text>
  <text x="1230" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="600" fill="#38bdf8">contact@mtlglabs.space</text>
